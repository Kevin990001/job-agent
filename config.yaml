# ── Scoring ────────────────────────────────────────────────────────────────────
scoring:
  min_score_to_include: 5          # 1-10; jobs below this are dropped
  tiers:
    hot: 24                        # hours — "Posted in last 24h"
    recent: 48                     # hours — "Posted in last 2 days"
    fresh: 168                     # hours — "Posted this week"

# ── JSearch (LinkedIn via RapidAPI) ───────────────────────────────────────────
jsearch:
  queries:
    - "software engineer"
    - "backend engineer"
    - "data engineer"
  location: "United States"
  employment_types: "FULLTIME"
  date_posted: "week"              # today | 3days | week | month
  num_pages: 2                     # 10 results/page; 2 queries × 2 pages = ~40 results

